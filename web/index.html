<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OSentinel — Enterprise SOC Command Console</title>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f3ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Light/Dark custom styles */
    .dark body {
      background-color: #080c14;
      color: #cbd5e1;
    }

    body {
      background-color: #f8fafc;
      color: #334155;
    }

    .dark .card-panel {
      background: #0f172a;
      border: 1px solid #1e293b;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.3);
    }

    .card-panel {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 15px -2px rgba(0, 0, 0, 0.05);
    }

    .dark .input-field {
      background: #090d16;
      border: 1px solid #1e293b;
      color: #f8fafc;
    }

    .input-field {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #0f172a;
    }

    .gauge-arc {
      stroke-width: 12;
      stroke-linecap: round;
      fill: none;
      stroke-dasharray: 283;
      transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="h-screen overflow-hidden">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- UTILS & FETCH (100% Preserved) ---
    const getToken = () => localStorage.getItem("osentinel_token");
    const setToken = (t) => t ? localStorage.setItem("osentinel_token", t) : localStorage.removeItem("osentinel_token");

    const apiFetch = async (path, options = {}) => {
      const headers = { "Content-Type": "application/json", ...options.headers };
      const token = getToken();
      if (token) headers["Authorization"] = `Bearer ${token}`;
      
      const res = await fetch(path, { ...options, headers });
      if (res.status === 401) {
        setToken(null);
        window.location.reload();
        throw new Error("Unauthorized");
      }
      return res;
    };

    // Safe Lucide Icon Renderer
    const Icon = ({ name, className = "", onClick, title }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (window.lucide && iconRef.current) {
          window.lucide.createIcons({
            attrs: { class: className },
            nameAttr: 'data-lucide',
            root: iconRef.current
          });
        }
      }, [name, className]);
      
      return <span ref={iconRef} onClick={onClick} title={title} className="inline-flex items-center justify-center flex-shrink-0"><i data-lucide={name}></i></span>;
    };

    // --- LOGIN SCREEN ---
    const LoginScreen = ({ onLogin, theme, toggleTheme }) => {
      const [email, setEmail] = useState("asus f15");
      const [password, setPassword] = useState("admin");
      const [error, setError] = useState("");

      const handleSubmit = async (e) => {
        e.preventDefault();
        try {
          const params = new URLSearchParams();
          params.append("username", email);
          params.append("password", password);
          const r = await fetch("/api/token", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: params
          });
          if (!r.ok) throw new Error("Invalid credentials");
          const data = await r.json();
          onLogin(data.access_token);
        } catch (err) {
          setError(err.message);
        }
      };

      return (
        <div className="flex h-screen w-full items-center justify-center relative p-4">
          <div className="absolute top-6 left-6 flex items-center gap-3">
             <div className="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
               <Icon name="shield" className="w-6 h-6" />
             </div>
             <div className="flex flex-col">
               <span className="text-xl font-bold tracking-tight">OSentinel</span>
               <span className="text-xs text-indigo-500 font-mono tracking-widest uppercase font-semibold">SOC Command Suite</span>
             </div>
          </div>

          <button onClick={toggleTheme} className="absolute top-6 right-6 p-2.5 rounded-xl card-panel hover:border-indigo-500 transition-colors">
            <Icon name={theme === 'dark' ? "sun" : "moon"} className="w-5 h-5 text-indigo-500" />
          </button>
          
          <div className="card-panel p-8 sm:p-10 rounded-2xl w-full max-w-md flex flex-col items-center z-10 relative">
            <div className="w-14 h-14 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center mb-4">
              <Icon name="shield-check" className="text-indigo-500 w-8 h-8" />
            </div>
            
            <h2 className="text-xl font-bold mb-1 text-center">Sign In to Dashboard</h2>
            <p className="text-xs text-slate-500 mb-6 text-center">Authenticate to access live telemetry and threat prevention</p>
            
            {error && (
              <div className="w-full bg-red-500/10 border border-red-500/20 text-red-500 p-3 rounded-xl text-xs mb-4 flex items-center gap-2">
                <Icon name="alert-triangle" className="w-4 h-4 flex-shrink-0" />
                <span>{error}</span>
              </div>
            )}
            
            <form onSubmit={handleSubmit} className="w-full flex flex-col gap-4">
              <div>
                <label className="text-xs font-semibold mb-1.5 block text-slate-400">Username / Email</label>
                <div className="relative">
                  <Icon name="mail" className="absolute left-3.5 top-3.5 w-4 h-4 text-slate-400" />
                  <input type="text" placeholder="Enter username" value={email} onChange={e=>setEmail(e.target.value)}
                    className="input-field w-full rounded-xl py-2.5 pl-10 pr-4 text-sm font-mono focus:outline-none focus:border-indigo-500 transition-colors" />
                </div>
              </div>
              
              <div>
                <label className="text-xs font-semibold mb-1.5 block text-slate-400">Password</label>
                <div className="relative">
                  <Icon name="key" className="absolute left-3.5 top-3.5 w-4 h-4 text-slate-400" />
                  <input type="password" placeholder="Enter password" value={password} onChange={e=>setPassword(e.target.value)}
                    className="input-field w-full rounded-xl py-2.5 pl-10 pr-10 text-sm font-mono focus:outline-none focus:border-indigo-500 transition-colors" />
                </div>
              </div>
              
              <button type="submit" className="mt-2 w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl transition-all shadow-lg shadow-indigo-600/25 text-sm flex items-center justify-center gap-2">
                <span>Authenticate Session</span>
                <Icon name="arrow-right" className="w-4 h-4" />
              </button>
            </form>
          </div>
        </div>
      );
    };

    // --- CHATBOT ANALYST ---
    const Chatbot = ({ session, hostState }) => {
      const [isOpen, setIsOpen] = useState(false);
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState("");
      const [loading, setLoading] = useState(false);
      const scrollRef = useRef();

      useEffect(() => {
        if(scrollRef.current && isOpen) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
      }, [messages, isOpen]);

      useEffect(() => {
        const handleAnalyze = (e) => {
          setIsOpen(true);
          setInput(`Analyze incident ${e.detail}`);
        };
        document.addEventListener("analyze_incident", handleAnalyze);
        return () => document.removeEventListener("analyze_incident", handleAnalyze);
      }, []);

      const sendMessage = async (e) => {
        if(e) e.preventDefault();
        if(!input.trim() || loading) return;
        
        const userMsg = input.trim();
        setInput("");
        setMessages(p => [...p, { role: "user", text: userMsg }]);
        setLoading(true);
        
        try {
          const res = await apiFetch("/api/assistant/chat", {
            method: "POST",
            body: JSON.stringify({ session, message: userMsg })
          });
          if (!res.ok) {
            const errText = await res.text();
            throw new Error(`Server returned ${res.status}: ${errText}`);
          }
          const data = await res.json();
          setMessages(p => [...p, { role: "ai", text: data.reply || "No response received." }]);
        } catch(err) {
          console.error(err);
          setMessages(p => [...p, { role: "ai", text: "AI Assistant Error: " + err.message }]);
        } finally {
          setLoading(false);
        }
      };

      if (!isOpen) {
        return (
          <button 
            onClick={() => setIsOpen(true)}
            className="fixed bottom-6 right-6 px-4 py-3 bg-indigo-600 text-white rounded-2xl flex items-center gap-3 shadow-xl shadow-indigo-600/30 hover:bg-indigo-500 transition-all z-50 font-medium text-xs"
          >
            <Icon name="bot" className="w-5 h-5" />
            <span>SOC Analyst AI</span>
            <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          </button>
        );
      }

      return (
        <div className="fixed bottom-6 right-6 w-96 card-panel rounded-2xl overflow-hidden flex flex-col z-50 shadow-2xl border border-indigo-500/30">
          <div className="bg-indigo-600 text-white p-3.5 flex justify-between items-center">
            <div className="flex items-center gap-2">
              <Icon name="bot" className="w-5 h-5" />
              <span className="text-xs font-semibold tracking-wide">SOC Analyst Assistant</span>
            </div>
            <div className="flex items-center gap-2 text-indigo-200">
              <Icon name="trash-2" onClick={() => setMessages([])} className="w-4 h-4 cursor-pointer hover:text-white" title="Clear Chat" />
              <Icon name="x" onClick={() => setIsOpen(false)} className="w-4 h-4 cursor-pointer hover:text-white" />
            </div>
          </div>
          
          <div className="h-[340px] overflow-y-auto p-4 flex flex-col gap-3 text-xs" ref={scrollRef}>
            {messages.length === 0 && (
              <div className="flex flex-col gap-2 my-auto">
                <p className="text-slate-400 text-center mb-2">How can I assist your incident response today?</p>
                <button onClick={() => setInput("What is the highest risk incident?")} className="p-2.5 rounded-xl border border-slate-700/50 hover:border-indigo-500 text-left text-indigo-400 transition-colors">
                  "What is the highest risk incident?"
                </button>
                <button onClick={() => setInput("Summarize recent process anomalies.")} className="p-2.5 rounded-xl border border-slate-700/50 hover:border-indigo-500 text-left text-indigo-400 transition-colors">
                  "Summarize recent process anomalies."
                </button>
              </div>
            )}
            {messages.map((m, i) => (
              <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                <div className={`p-3 rounded-2xl max-w-[85%] leading-relaxed ${m.role === 'user' ? 'bg-indigo-600 text-white rounded-br-none' : 'input-field rounded-bl-none'}`}>
                  {m.text}
                </div>
              </div>
            ))}
            {loading && (
              <div className="flex gap-2 items-center text-slate-400">
                <Icon name="loader-2" className="w-4 h-4 animate-spin text-indigo-500" />
                <span>Analyzing telemetry data...</span>
              </div>
            )}
          </div>
          
          <form onSubmit={sendMessage} className="p-3 border-t border-slate-800 flex items-center gap-2">
            <input type="text" placeholder="Ask AI analyst..." value={input} onChange={e=>setInput(e.target.value)}
              className="input-field text-xs w-full outline-none py-2 px-3 rounded-xl" />
            <button type="submit" className="p-2 bg-indigo-600 text-white rounded-xl hover:bg-indigo-500 transition-colors">
              <Icon name="send" className="w-4 h-4" />
            </button>
          </form>
        </div>
      );
    };

    // --- MAIN DASHBOARD ---
    const Dashboard = ({ state, logout, theme, toggleTheme }) => {
      const [navSection, setNavSection] = useState("overview"); // overview, detections, processes, telemetry, rules, config
      const [topTab, setTopTab] = useState("Signals");
      const [bottomTab, setBottomTab] = useState("Response log");
      const [searchTerm, setSearchTerm] = useState("");

      // Calculate dynamic threat posture risk score
      const riskScore = useMemo(() => {
        const incidents = state?.incidents || [];
        const top = incidents.length > 0 ? incidents[0].score : 0;
        const active = incidents.filter(i => i.score >= 30);
        
        let finalScore = top;
        if (active.length > 1) finalScore += (active.length * 5);
        if (top >= 70) finalScore += 20;
        
        return Math.min(100.0, finalScore);
      }, [state?.incidents]);

      // Filter signals and events based on search input
      const filteredSignals = useMemo(() => {
        const detections = state?.detections || [];
        if (!searchTerm) return detections;
        return detections.filter(d => 
          (d.rule_id || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
          (d.entity || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
          (d.title || d.detail || '').toLowerCase().includes(searchTerm.toLowerCase())
        );
      }, [state?.detections, searchTerm]);

      const filteredEvents = useMemo(() => {
        const events = state?.events || [];
        if (!searchTerm) return events;
        return events.filter(e => 
          (e.category || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
          (e.action || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
          (e.entity || '').toLowerCase().includes(searchTerm.toLowerCase())
        );
      }, [state?.events, searchTerm]);

      // Handle Left Sidebar Nav Items
      const handleNavClick = (section) => {
        setNavSection(section);
        if (section === "overview") {
          setTopTab("Signals");
          setBottomTab("Response log");
        } else if (section === "detections") {
          setTopTab("Signals");
        } else if (section === "processes") {
          setBottomTab("Processes");
        } else if (section === "telemetry") {
          setTopTab("Raw events");
          setBottomTab("Raw events");
        } else if (section === "rules") {
          setTopTab("Signatures");
          setBottomTab("Signatures");
        } else if (section === "config") {
          setBottomTab("Host");
        }
      };

      return (
        <div className="flex h-screen w-full overflow-hidden">
          {/* 1. Left Vertical Navigation Sidebar */}
          <aside className="w-16 md:w-64 border-r border-slate-200 dark:border-slate-800 flex flex-col justify-between flex-shrink-0 card-panel z-20">
            <div>
              {/* Logo Header */}
              <div className="h-16 flex items-center px-4 border-b border-slate-200 dark:border-slate-800 gap-3">
                <div className="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white flex-shrink-0 shadow-lg shadow-indigo-600/30">
                  <Icon name="shield" className="w-5 h-5" />
                </div>
                <div className="hidden md:flex flex-col">
                  <span className="font-bold text-sm tracking-tight">OSentinel</span>
                  <span className="text-[10px] text-indigo-500 font-mono tracking-wider font-semibold">ENTERPRISE SOC</span>
                </div>
              </div>

              {/* Navigation Items */}
              <nav className="p-3 space-y-1.5">
                {[
                  { id: 'overview', label: 'SOC Overview', icon: 'layout-dashboard' },
                  { id: 'detections', label: 'Signal Detections', icon: 'shield-alert' },
                  { id: 'processes', label: 'Process Pool', icon: 'cpu' },
                  { id: 'telemetry', label: 'Raw Telemetry', icon: 'activity' },
                  { id: 'rules', label: 'YARA Signatures', icon: 'file-code' },
                  { id: 'config', label: 'Agent Status', icon: 'server' },
                ].map((item) => (
                  <button
                    key={item.id}
                    onClick={() => handleNavClick(item.id)}
                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-medium transition-all ${
                      navSection === item.id 
                        ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/20' 
                        : 'text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60 hover:text-slate-200'
                    }`}
                  >
                    <Icon name={item.icon} className="w-4 h-4" />
                    <span className="hidden md:inline">{item.label}</span>
                  </button>
                ))}
              </nav>
            </div>

            {/* Bottom Actions */}
            <div className="p-3 border-t border-slate-200 dark:border-slate-800 space-y-2">
              <button onClick={toggleTheme} className="w-full flex items-center gap-3 px-3 py-2 rounded-xl text-xs text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                <Icon name={theme === 'dark' ? "sun" : "moon"} className="w-4 h-4 text-indigo-500" />
                <span className="hidden md:inline font-medium">{theme === 'dark' ? 'Light Theme' : 'Dark Theme'}</span>
              </button>
              
              <button onClick={logout} className="w-full flex items-center gap-3 px-3 py-2 rounded-xl text-xs text-red-500 hover:bg-red-500/10 transition-colors">
                <Icon name="log-out" className="w-4 h-4" />
                <span className="hidden md:inline font-medium">Logout Session</span>
              </button>
            </div>
          </aside>

          {/* 2. Main Content Container */}
          <div className="flex-1 flex flex-col h-full overflow-hidden">
            
            {/* Top Operational Header */}
            <header className="h-16 border-b border-slate-200 dark:border-slate-800 card-panel px-6 flex items-center justify-between flex-shrink-0 z-10">
              <div className="flex items-center gap-4">
                <div className="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-lg input-field text-xs font-mono">
                  <Icon name="monitor" className="w-3.5 h-3.5 text-indigo-500" />
                  <span className="font-semibold">{state?.status?.host?.hostname || 'LocalHost'}</span>
                  <span className="text-slate-500">|</span>
                  <span className="text-slate-400">{state?.status?.host?.platform || 'Win 11'}</span>
                </div>

                <div className="flex items-center gap-2 px-3 py-1 rounded-full text-[11px] font-semibold border border-emerald-500/30 bg-emerald-500/10 text-emerald-500">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  <span>LIVE TELEMETRY STREAM</span>
                </div>

                {state?.status?.response?.mode === "enforcing" ? (
                  <div className="hidden md:flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold border border-red-500/30 bg-red-500/10 text-red-500">
                    <Icon name="shield-check" className="w-3.5 h-3.5" />
                    <span>PREVENTION ARMED</span>
                  </div>
                ) : (
                  <div className="hidden md:flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold border border-amber-500/30 bg-amber-500/10 text-amber-500">
                    <Icon name="shield-alert" className="w-3.5 h-3.5" />
                    <span>SAFE MODE (DRY RUN)</span>
                  </div>
                )}
              </div>

              {/* Search Bar & User */}
              <div className="flex items-center gap-4">
                <div className="relative w-48 lg:w-64">
                  <Icon name="search" className="absolute left-3 top-2.5 w-3.5 h-3.5 text-slate-400" />
                  <input
                    type="text"
                    placeholder="Filter telemetry view..."
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="input-field w-full py-1.5 pl-9 pr-3 rounded-xl text-xs focus:outline-none focus:border-indigo-500 transition-colors"
                  />
                </div>

                <div className="h-6 w-px bg-slate-700/40"></div>

                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-500 font-bold text-xs">
                    SA
                  </div>
                </div>
              </div>
            </header>

            {/* Dashboard Main Grid Area */}
            <div className="flex-1 overflow-y-auto p-4 md:p-6 space-y-6">
              
              {/* TOP ROW: Threat Posture Gauge & Incidents Box */}
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                
                {/* Threat Posture Arc Card */}
                <div className="lg:col-span-4 card-panel p-6 rounded-2xl flex flex-col justify-between relative overflow-hidden">
                  <div className="flex justify-between items-center mb-4">
                    <span className="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                      <Icon name="activity" className="w-4 h-4 text-indigo-500" />
                      Threat Posture Assessment
                    </span>
                    <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">REALTIME</span>
                  </div>

                  <div className="flex flex-col items-center justify-center my-2">
                    <div className="relative w-48 h-28 flex justify-center">
                      <svg viewBox="0 0 100 50" className="w-full h-full">
                        <defs>
                          <linearGradient id="gaugeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stopColor="#10b981" />
                            <stop offset="50%" stopColor="#f59e0b" />
                            <stop offset="100%" stopColor="#ef4444" />
                          </linearGradient>
                        </defs>
                        <path d="M 10 50 A 40 40 0 0 1 90 50" fill="none" stroke="rgba(148, 163, 184, 0.15)" strokeWidth="12" strokeLinecap="round" />
                        <path className="gauge-arc" d="M 10 50 A 40 40 0 0 1 90 50" stroke="url(#gaugeGradient)" style={{ strokeDashoffset: 125 - (riskScore / 100) * 125 }} />
                      </svg>
                      <div className="absolute bottom-1 flex items-baseline gap-0.5">
                        <span className={`text-3xl font-extrabold tracking-tight ${riskScore > 80 ? 'text-red-500' : riskScore > 40 ? 'text-amber-500' : 'text-emerald-500'}`}>
                          {Math.round(riskScore)}
                        </span>
                        <span className="text-sm font-bold text-slate-400">%</span>
                      </div>
                    </div>

                    <div className={`mt-3 text-xs font-extrabold uppercase tracking-widest ${riskScore > 80 ? 'text-red-500' : riskScore > 40 ? 'text-amber-500' : 'text-emerald-500'}`}>
                      {riskScore >= 100 ? "MAXIMUM RISK LEVEL" : riskScore > 80 ? "CRITICAL THREAT" : riskScore > 40 ? "ELEVATED RISK" : "SYSTEM SECURE"}
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3 mt-4 pt-4 border-t border-slate-200 dark:border-slate-800 text-center">
                    <div className="p-2 rounded-xl input-field">
                      <div className="text-[10px] text-slate-400 uppercase font-medium">Active Incidents</div>
                      <div className="text-base font-bold text-slate-200">{state?.incidents?.length || 0}</div>
                    </div>
                    <div className="p-2 rounded-xl input-field">
                      <div className="text-[10px] text-slate-400 uppercase font-medium">Critical Signals</div>
                      <div className="text-base font-bold text-red-400">{state?.incidents?.filter(i => i.score > 50).length || 0}</div>
                    </div>
                  </div>
                </div>

                {/* Active Incidents Container Card */}
                <div className="lg:col-span-8 card-panel p-6 rounded-2xl flex flex-col">
                  <div className="flex justify-between items-center mb-4">
                    <span className="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                      <Icon name="alert-triangle" className="w-4 h-4 text-amber-500" />
                      Active Incident Queue
                    </span>
                    <span className="text-xs font-medium text-slate-400">{state?.incidents?.length || 0} Pending Analysis</span>
                  </div>

                  <div className="flex-1 overflow-y-auto space-y-3 max-h-[220px] pr-1">
                    {(!state?.incidents || state.incidents.length === 0) && (
                      <div className="h-full flex flex-col items-center justify-center py-10 text-slate-400 text-xs">
                        <Icon name="check-circle-2" className="w-8 h-8 text-emerald-500 mb-2" />
                        <span>No threat incidents detected in queue</span>
                      </div>
                    )}
                    {state?.incidents?.map(i => (
                      <div 
                        key={i.id} 
                        onClick={() => document.dispatchEvent(new CustomEvent("analyze_incident", { detail: i.id }))}
                        className="p-4 rounded-xl border border-slate-200 dark:border-slate-800 hover:border-indigo-500/50 input-field cursor-pointer transition-all flex flex-col sm:flex-row justify-between gap-4"
                      >
                        <div className="flex gap-3">
                          <div className={`px-2.5 py-1 rounded-lg text-center h-fit text-[10px] font-bold ${i.score > 80 ? 'bg-red-500/20 text-red-500 border border-red-500/30' : 'bg-amber-500/20 text-amber-500 border border-amber-500/30'}`}>
                            {i.score > 80 ? 'CRIT' : 'HIGH'}<br/>
                            <span className="text-sm">{Math.round(i.score)}</span>
                          </div>
                          <div>
                            <h4 className="text-xs font-bold text-indigo-400 font-mono mb-1">{i.detections[0]?.rule_id || "Suspicious Execution"}</h4>
                            <p className="text-xs text-slate-300">{i.detections[0]?.title || "Behavioral anomaly detected on endpoint process"}</p>
                            
                            {i.detections[0]?.remediation && (
                              <div className="mt-2 p-2 bg-emerald-500/10 border border-emerald-500/20 rounded-lg text-[11px] font-mono text-emerald-400">
                                💡 Suggested Remediation: {i.detections[0].remediation}
                              </div>
                            )}
                          </div>
                        </div>

                        <div className="flex sm:flex-col justify-between items-end flex-shrink-0 text-[10px] text-slate-400 font-mono">
                          <span>ID: {i.id.substring(0,8)}</span>
                          <span className="text-indigo-400">{i.detections.length} signals &gt;</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              {/* MIDDLE ROW: KPI Metrics Sparkline Cards */}
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                {[
                  { label: "Memory Allocation", value: `${state?.metrics?.mem_percent?.toFixed(1) || '0.0'}%`, key: 'mem_percent', color: '#f97316' },
                  { label: "CPU Core Load", value: `${state?.metrics?.cpu_percent?.toFixed(1) || '0.0'}%`, key: 'cpu_percent', color: '#6366f1' },
                  { label: "Kernel Switches", value: `${state?.metrics?.ctx_switches_per_s?.toFixed(0) || 0}/s`, key: 'ctx_switches_per_s', color: '#10b981' },
                  { label: "Active Process Pool", value: state?.metrics?.process_count || 0, key: 'process_count', color: '#3b82f6' },
                ].map((m, idx) => (
                  <div key={idx} className="card-panel p-4 rounded-2xl flex flex-col justify-between">
                    <div className="flex justify-between items-center mb-1">
                      <span className="text-xs text-slate-400 font-medium">{m.label}</span>
                      <span className="text-xs font-bold font-mono">{m.value}</span>
                    </div>
                    <svg className="w-full h-9 mt-2" viewBox="0 0 100 30" preserveAspectRatio="none">
                      <polyline 
                        fill="none" 
                        stroke={m.color} 
                        strokeWidth="2" 
                        points={(state?.history || []).map((h, i, arr) => `${(i / (arr.length || 1)) * 100},${30 - (Math.min(h[m.key] || 0, 100) / 100) * 30}`).join(' ')} 
                      />
                    </svg>
                  </div>
                ))}
              </div>

              {/* BOTTOM SECTION: Dual Tab Telemetry Tables */}
              <div className="card-panel rounded-2xl p-6 space-y-4">
                
                {/* Top Tab Bar */}
                <div className="flex flex-wrap items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3 gap-2">
                  <div className="flex gap-4 text-xs font-medium">
                    {["Signals", "Signatures", "Raw events"].map(t => (
                      <button 
                        key={t}
                        onClick={() => setTopTab(t)}
                        className={`pb-2 transition-all ${topTab === t ? "border-b-2 border-indigo-500 text-indigo-500 font-bold" : "text-slate-400 hover:text-slate-200"}`}
                      >
                        {t}
                      </button>
                    ))}
                  </div>
                  <span className="text-xs text-slate-400 font-mono">Live Ingestion Stream</span>
                </div>

                {/* Telemetry Display Grid */}
                <div className="overflow-x-auto min-h-[200px]">
                  {topTab === "Signals" && (
                    <table className="w-full text-xs text-left">
                      <thead className="text-slate-400 font-medium border-b border-slate-200 dark:border-slate-800">
                        <tr>
                          <th className="py-2">Timestamp</th>
                          <th className="py-2">Category</th>
                          <th className="py-2">Rule ID</th>
                          <th className="py-2">Target Entity</th>
                          <th className="py-2">Detection Detail</th>
                        </tr>
                      </thead>
                      <tbody className="font-mono text-[11px] divide-y divide-slate-200 dark:divide-slate-800/50">
                        {filteredSignals.slice(0, 50).map((d, i) => (
                          <tr key={i} className="hover:bg-slate-500/5 transition-colors">
                            <td className="py-2.5 text-slate-400">{new Date((d.ts || 0) * 1000).toLocaleTimeString()}</td>
                            <td className="py-2.5"><span className="px-2 py-0.5 rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">{d.category || 'system'}</span></td>
                            <td className="py-2.5 text-slate-200 font-bold">{d.rule_id}</td>
                            <td className="py-2.5 text-emerald-400">{d.entity || '-'}</td>
                            <td className="py-2.5 text-slate-400">{d.title || d.detail || '-'}</td>
                          </tr>
                        ))}
                        {filteredSignals.length === 0 && (
                          <tr><td colSpan="5" className="py-8 text-center text-slate-500">No signals matching filter...</td></tr>
                        )}
                      </tbody>
                    </table>
                  )}

                  {topTab === "Raw events" && (
                    <table className="w-full text-xs text-left">
                      <thead className="text-slate-400 font-medium border-b border-slate-200 dark:border-slate-800">
                        <tr>
                          <th className="py-2">Timestamp</th>
                          <th className="py-2">Category</th>
                          <th className="py-2">Action</th>
                          <th className="py-2">Process PID</th>
                          <th className="py-2">Path / Entity</th>
                        </tr>
                      </thead>
                      <tbody className="font-mono text-[11px] divide-y divide-slate-200 dark:divide-slate-800/50">
                        {filteredEvents.slice(0, 50).map((e, i) => (
                          <tr key={i} className="hover:bg-slate-500/5 transition-colors">
                            <td className="py-2.5 text-slate-400">{new Date((e.ts || 0) * 1000).toLocaleTimeString()}</td>
                            <td className="py-2.5 text-slate-300">{e.category}</td>
                            <td className="py-2.5 text-indigo-400">{e.action}</td>
                            <td className="py-2.5 text-slate-300">{(e.attrs?.pid || e.pid) ? `${e.attrs?.pid || e.pid}` : '-'}</td>
                            <td className="py-2.5 text-slate-400 truncate max-w-xs">{e.entity || '-'}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}

                  {topTab === "Signatures" && (
                    <div className="p-4 text-xs text-slate-400 space-y-2">
                      <p className="font-bold text-slate-200">Loaded Detection Engine Rules</p>
                      <p>Total Rules Active: {state?.status?.detectors?.rules_loaded || 0}</p>
                      <p>Active YARA Definitions: {state?.status?.detectors?.yara_files_loaded || 0}</p>
                    </div>
                  )}
                </div>

                {/* Bottom Inspector Tabs */}
                <div className="border-t border-slate-200 dark:border-slate-800 pt-4">
                  <div className="flex gap-4 text-xs font-medium border-b border-slate-200 dark:border-slate-800 pb-2 mb-3">
                    {["Response log", "Processes", "Host", "Pipeline"].map(bt => (
                      <button 
                        key={bt}
                        onClick={() => setBottomTab(bt)}
                        className={`transition-all ${bottomTab === bt ? "text-indigo-500 font-bold border-b-2 border-indigo-500 pb-2" : "text-slate-400 hover:text-slate-200"}`}
                      >
                        {bt}
                      </button>
                    ))}
                  </div>

                  <div className="overflow-x-auto min-h-[160px]">
                    {bottomTab === "Response log" && (
                      <table className="w-full text-xs text-left">
                        <thead className="text-slate-400 font-medium">
                          <tr>
                            <th className="py-1.5">Timestamp</th>
                            <th className="py-1.5">Mitigation Action</th>
                            <th className="py-1.5">Target Entity</th>
                            <th className="py-1.5">Execution Outcome</th>
                            <th className="py-1.5">Reason / Rule Trigger</th>
                          </tr>
                        </thead>
                        <tbody className="font-mono text-[11px] divide-y divide-slate-200 dark:divide-slate-800/50">
                          {state?.actions?.map((a, i) => (
                            <tr key={i} className="hover:bg-slate-500/5">
                              <td className="py-2 text-slate-400">{new Date((a.ts || 0) * 1000).toLocaleTimeString()}</td>
                              <td className="py-2"><span className="bg-purple-500/20 text-purple-400 px-2 py-0.5 rounded border border-purple-500/30">{a.action}</span></td>
                              <td className="py-2 text-slate-300">{a.target}</td>
                              <td className="py-2"><span className="text-slate-400 border border-slate-700 px-2 py-0.5 rounded">{a.dry_run ? 'DRY RUN / WITHHELD' : a.executed ? 'EXECUTED' : 'FAILED'}</span></td>
                              <td className="py-2 text-slate-400">{a.detail}</td>
                            </tr>
                          ))}
                          {(!state?.actions || state.actions.length === 0) && (
                            <tr><td colSpan="5" className="py-6 text-center text-slate-500">No mitigation actions logged yet</td></tr>
                          )}
                        </tbody>
                      </table>
                    )}

                    {bottomTab === "Processes" && (
                      <table className="w-full text-xs text-left">
                        <thead className="text-slate-400 font-medium">
                          <tr>
                            <th className="py-1.5">PID</th>
                            <th className="py-1.5">Process Name</th>
                            <th className="py-1.5">User</th>
                            <th className="py-1.5">CPU %</th>
                            <th className="py-1.5">Command Line</th>
                          </tr>
                        </thead>
                        <tbody className="font-mono text-[11px] divide-y divide-slate-200 dark:divide-slate-800/50">
                          {state?.processes?.slice(0, 15).map((p, i) => (
                            <tr key={i} className="hover:bg-slate-500/5">
                              <td className="py-2 text-indigo-400">{p.pid}</td>
                              <td className="py-2 font-bold text-slate-200">{p.name}</td>
                              <td className="py-2 text-slate-400">{p.user}</td>
                              <td className="py-2 text-amber-500">{p.cpu}</td>
                              <td className="py-2 text-slate-400 truncate max-w-md">{p.cmdline || '-'}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    )}

                    {bottomTab === "Host" && (
                      <div className="grid grid-cols-2 sm:grid-cols-3 gap-4 text-xs font-mono text-slate-300 p-2">
                        <div><span className="text-slate-500">Hostname:</span> {state?.status?.host?.hostname}</div>
                        <div><span className="text-slate-500">Platform:</span> {state?.status?.host?.platform}</div>
                        <div><span className="text-slate-500">Architecture:</span> {state?.status?.host?.arch}</div>
                        <div><span className="text-slate-500">Kernel:</span> {state?.status?.host?.kernel}</div>
                        <div><span className="text-slate-500">Uptime:</span> {Math.round((state?.status?.host?.uptime_s || 0) / 3600)} hrs</div>
                      </div>
                    )}

                    {bottomTab === "Pipeline" && (
                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 text-xs font-mono text-slate-300 p-2">
                        <div><span className="text-slate-500">Queue Depth:</span> {state?.status?.pipeline?.queue_depth}</div>
                        <div><span className="text-slate-500">Events Processed:</span> {state?.status?.pipeline?.events_processed}</div>
                        <div><span className="text-slate-500">Events Dropped:</span> {state?.status?.pipeline?.events_dropped}</div>
                        <div><span className="text-slate-500">Throughput:</span> {state?.status?.pipeline?.throughput_eps} EPS</div>
                      </div>
                    )}
                  </div>
                </div>

              </div>

            </div>
          </div>

          {/* AI Chat Analyst Assistant */}
          <Chatbot session="react_client" hostState={state} />
        </div>
      );
    };

    // --- MAIN REACT ROOT ---
    const App = () => {
      const [token, setTokenState] = useState(getToken());
      const [state, setState] = useState(null);
      const [theme, setTheme] = useState('dark');
      const wsRef = useRef(null);

      // Theme toggle switcher
      const toggleTheme = () => {
        const nextTheme = theme === 'dark' ? 'light' : 'dark';
        setTheme(nextTheme);
        if (nextTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      };

      useEffect(() => {
        document.documentElement.classList.add('dark');
      }, []);

      const handleLogin = (t) => {
        setToken(t);
        setTokenState(t);
      };
      
      const handleLogout = () => {
        setToken(null);
        setTokenState(null);
      };

      // WebSocket Ingestion Pipeline Binding
      useEffect(() => {
        if (!token) return;
        
        let wsProto = window.location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(`${wsProto}//${window.location.host}/ws`);
        
        ws.onopen = () => ws.send(JSON.stringify({ type: "auth", token }));
        ws.onmessage = (e) => {
          try {
            const msg = JSON.parse(e.data);
            if (msg.type === "snapshot") {
              setState(prev => ({ ...prev, ...msg.data }));
            } else if (msg.type === "metrics") {
              setState(prev => ({
                ...prev,
                metrics: msg.data,
                history: [...(prev?.history || []), msg.data].slice(-120)
              }));
            } else if (msg.type === "events") {
              setState(prev => ({ ...prev, events: [...msg.data, ...(prev?.events || [])].slice(0, 120) }));
            } else if (msg.type === "detections") {
              setState(prev => ({ ...prev, detections: [...msg.data, ...(prev?.detections || [])].slice(0, 80) }));
            } else if (msg.type === "incident") {
              setState(prev => {
                const incs = [...(prev?.incidents || [])];
                const idx = incs.findIndex(i => i.id === msg.data.id);
                if(idx >= 0) incs[idx] = msg.data;
                else incs.unshift(msg.data);
                return { ...prev, incidents: incs };
              });
            } else if (msg.type === "action") {
              setState(prev => ({ ...prev, actions: [msg.data, ...(prev?.actions || [])].slice(0, 30) }));
            }
          } catch(err) {}
        };
        ws.onclose = () => console.log("WebSocket connection closed");
        wsRef.current = ws;

        const poll = setInterval(async () => {
           try { await apiFetch("/api/health"); } catch(e) {}
        }, 5000);

        return () => {
          ws.close();
          clearInterval(poll);
        };
      }, [token]);

      if (!token) return <LoginScreen onLogin={handleLogin} theme={theme} toggleTheme={toggleTheme} />;
      return <Dashboard state={state} logout={handleLogout} theme={theme} toggleTheme={toggleTheme} />;
    };

    setTimeout(() => {
      if(window.lucide) window.lucide.createIcons();
    }, 100);

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
