<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OSentinel — Enterprise SOC Command Console</title>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f3ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .dark body {
      background-color: #080c14;
      color: #cbd5e1;
    }

    body {
      background-color: #f8fafc;
      color: #334155;
    }

    .dark .card-panel {
      background: #0f172a;
      border: 1px solid #1e293b;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.3);
    }

    .card-panel {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 15px -2px rgba(0, 0, 0, 0.05);
    }

    .dark .input-field {
      background: #090d16;
      border: 1px solid #1e293b;
      color: #f8fafc;
    }

    .input-field {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #0f172a;
    }

    .gauge-arc {
      stroke-width: 12;
      stroke-linecap: round;
      fill: none;
      stroke-dasharray: 283;
      transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="h-screen overflow-hidden">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const getToken = () => localStorage.getItem("osentinel_token");
    const setToken = (t) => t ? localStorage.setItem("osentinel_token", t) : localStorage.removeItem("osentinel_token");

    const apiFetch = async (path, options = {}) => {
      const headers = { "Content-Type": "application/json", ...options.headers };
      const token = getToken();
      if (token) headers["Authorization"] = `Bearer ${token}`;
      
      const res = await fetch(path, { ...options, headers });
      if (res.status === 401) {
        setToken(null);
        window.location.reload();
        throw new Error("Unauthorized");
      }
      return res;
    };

    const Icon = ({ name, className = "", onClick, title }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (window.lucide && iconRef.current) {
          iconRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
          window.lucide.createIcons({ root: iconRef.current });
        }
      }, [name, className]);
      
      return <span ref={iconRef} onClick={onClick} title={title} className="inline-flex items-center justify-center flex-shrink-0 cursor-pointer" />;
    };

    // --- LOGIN SCREEN ---
    const LoginScreen = ({ onLogin, theme, toggleTheme }) => {
      const [email, setEmail] = useState("asus f15");
      const [password, setPassword] = useState("admin");
      const [error, setError] = useState("");

      const handleSubmit = async (e) => {
        e.preventDefault();
        try {
          const params = new URLSearchParams();
          params.append("username", email);
          params.append("password", password);
          const r = await fetch("/api/token", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: params
          });
          if (!r.ok) throw new Error("Invalid credentials");
          const data = await r.json();
          onLogin(data.access_token);
        } catch (err) {
          setError(err.message);
        }
      };

      return (
        <div className="flex h-screen w-full items-center justify-center relative p-4">
          <div className="absolute top-6 left-6 flex items-center gap-3">
             <div className="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
               <Icon name="shield" className="w-6 h-6" />
             </div>
             <div className="flex flex-col">
               <span className="text-xl font-bold tracking-tight">OSentinel</span>
               <span className="text-xs text-indigo-500 font-mono tracking-widest uppercase font-semibold">SOC Command Suite</span>
             </div>
          </div>

          <button onClick={toggleTheme} className="absolute top-6 right-6 p-2.5 rounded-xl card-panel hover:border-indigo-500 transition-colors">
            <Icon name={theme === 'dark' ? "sun" : "moon"} className="w-5 h-5 text-indigo-500" />
          </button>
          
          <div className="card-panel p-8 sm:p-10 rounded-2xl w-full max-w-md flex flex-col items-center z-10 relative">
            <div className="w-14 h-14 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center mb-4">
              <Icon name="shield-check" className="text-indigo-500 w-8 h-8" />
            </div>
            <h2 className="text-xl font-bold mb-1 text-center">Sign In to Dashboard</h2>
            <p className="text-xs text-slate-500 mb-6 text-center">Authenticate to access live telemetry and threat prevention</p>
            {error && (
              <div className="w-full bg-red-500/10 border border-red-500/20 text-red-500 p-3 rounded-xl text-xs mb-4 flex items-center gap-2">
                <Icon name="alert-triangle" className="w-4 h-4 flex-shrink-0" />
                <span>{error}</span>
              </div>
            )}
            <form onSubmit={handleSubmit} className="w-full flex flex-col gap-4">
              <div>
                <label className="text-xs font-semibold mb-1.5 block text-slate-400">Username / Email</label>
                <div className="relative">
                  <Icon name="mail" className="absolute left-3.5 top-3.5 w-4 h-4 text-slate-400" />
                  <input type="text" placeholder="Enter username" value={email} onChange={e=>setEmail(e.target.value)}
                    className="input-field w-full rounded-xl py-2.5 pl-10 pr-4 text-sm font-mono focus:outline-none focus:border-indigo-500 transition-colors" />
                </div>
              </div>
              <div>
                <label className="text-xs font-semibold mb-1.5 block text-slate-400">Password</label>
                <div className="relative">
                  <Icon name="key" className="absolute left-3.5 top-3.5 w-4 h-4 text-slate-400" />
                  <input type="password" placeholder="Enter password" value={password} onChange={e=>setPassword(e.target.value)}
                    className="input-field w-full rounded-xl py-2.5 pl-10 pr-10 text-sm font-mono focus:outline-none focus:border-indigo-500 transition-colors" />
                </div>
              </div>
              <button type="submit" className="mt-2 w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl transition-all shadow-lg shadow-indigo-600/25 text-sm flex items-center justify-center gap-2">
                <span>Authenticate Session</span>
                <Icon name="arrow-right" className="w-4 h-4" />
              </button>
            </form>
          </div>
        </div>
      );
    };

    // --- CHATBOT ---
    const Chatbot = ({ session, hostState }) => {
      const [isOpen, setIsOpen] = useState(false);
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState("");
      const [loading, setLoading] = useState(false);
      const scrollRef = useRef();

      useEffect(() => {
        if(scrollRef.current && isOpen) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
      }, [messages, isOpen]);

      useEffect(() => {
        const handleAnalyze = (e) => {
          setIsOpen(true);
          setInput(`Analyze incident ${e.detail}`);
        };
        document.addEventListener("analyze_incident", handleAnalyze);
        return () => document.removeEventListener("analyze_incident", handleAnalyze);
      }, []);

      const sendMessage = async (e) => {
        if(e) e.preventDefault();
        if(!input.trim() || loading) return;
        
        const userMsg = input.trim();
        setInput("");
        setMessages(p => [...p, { role: "user", text: userMsg }]);
        setLoading(true);
        
        try {
          const res = await apiFetch("/api/assistant/chat", {
            method: "POST",
            body: JSON.stringify({ session, message: userMsg })
          });
          if (!res.ok) throw new Error(`Server returned ${res.status}`);
          const data = await res.json();
          setMessages(p => [...p, { role: "ai", text: data.reply || "No response received." }]);
        } catch(err) {
          setMessages(p => [...p, { role: "ai", text: "AI Assistant Error: " + err.message }]);
        } finally {
          setLoading(false);
        }
      };

      if (!isOpen) {
        return (
          <button 
            onClick={() => setIsOpen(true)}
            className="fixed bottom-6 right-6 px-4 py-3 bg-indigo-600 text-white rounded-2xl flex items-center gap-3 shadow-xl shadow-indigo-600/30 hover:bg-indigo-500 transition-all z-50 font-medium text-xs"
          >
            <Icon name="bot" className="w-5 h-5" />
            <span>SOC Analyst AI</span>
            <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          </button>
        );
      }

      return (
        <div className="fixed bottom-6 right-6 w-96 card-panel rounded-2xl overflow-hidden flex flex-col z-50 shadow-2xl border border-indigo-500/30">
          <div className="bg-indigo-600 text-white p-3.5 flex justify-between items-center">
            <div className="flex items-center gap-2">
              <Icon name="bot" className="w-5 h-5" />
              <span className="text-xs font-semibold tracking-wide">SOC Analyst Assistant</span>
            </div>
            <div className="flex items-center gap-2 text-indigo-200">
              <Icon name="trash-2" onClick={() => setMessages([])} className="w-4 h-4 cursor-pointer hover:text-white" title="Clear Chat" />
              <Icon name="x" onClick={() => setIsOpen(false)} className="w-4 h-4 cursor-pointer hover:text-white" />
            </div>
          </div>
          
          <div className="h-[340px] overflow-y-auto p-4 flex flex-col gap-3 text-xs" ref={scrollRef}>
            {messages.length === 0 && (
              <div className="flex flex-col gap-2 my-auto">
                <p className="text-slate-400 text-center mb-2">How can I assist your incident response today?</p>
                <button onClick={() => setInput("What is the highest risk incident?")} className="p-2.5 rounded-xl border border-slate-700/50 hover:border-indigo-500 text-left text-indigo-400 transition-colors">
                  "What is the highest risk incident?"
                </button>
                <button onClick={() => setInput("Summarize recent process anomalies.")} className="p-2.5 rounded-xl border border-slate-700/50 hover:border-indigo-500 text-left text-indigo-400 transition-colors">
                  "Summarize recent process anomalies."
                </button>
              </div>
            )}
            {messages.map((m, i) => (
              <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                <div className={`p-3 rounded-2xl max-w-[85%] leading-relaxed ${m.role === 'user' ? 'bg-indigo-600 text-white rounded-br-none' : 'input-field rounded-bl-none'}`}>
                  {m.text}
                </div>
              </div>
            ))}
            {loading && (
              <div className="flex gap-2 items-center text-slate-400">
                <Icon name="loader-2" className="w-4 h-4 animate-spin text-indigo-500" />
                <span>Analyzing telemetry data...</span>
              </div>
            )}
          </div>
          
          <form onSubmit={sendMessage} className="p-3 border-t border-slate-800 flex items-center gap-2">
            <input type="text" placeholder="Ask AI analyst..." value={input} onChange={e=>setInput(e.target.value)}
              className="input-field text-xs w-full outline-none py-2 px-3 rounded-xl" />
            <button type="submit" className="p-2 bg-indigo-600 text-white rounded-xl hover:bg-indigo-500 transition-colors">
              <Icon name="send" className="w-4 h-4" />
            </button>
          </form>
        </div>
      );
    };

    // --- MAIN DASHBOARD ---
    const Dashboard = ({ state, logout, theme, toggleTheme }) => {
      const [viewMode, setViewMode] = useState("overview");
      const [searchTerm, setSearchTerm] = useState("");
      const [severityFilter, setSeverityFilter] = useState("all");
      const [isolatedHosts, setIsolatedHosts] = useState({});
      const [acknowledgedIncidents, setAcknowledgedIncidents] = useState({});

      const riskScore = useMemo(() => {
        const incidents = state?.incidents || [];
        const top = incidents.length > 0 ? incidents[0].score : 0;
        const active = incidents.filter(i => i.score >= 30);
        
        let finalScore = top;
        if (active.length > 1) finalScore += (active.length * 5);
        if (top >= 70) finalScore += 20;
        
        return Math.min(100.0, finalScore);
      }, [state?.incidents]);

      // Calculate Severity Counts
      const severityCounts = useMemo(() => {
        const incidents = state?.incidents || [];
        let crit = 0, high = 0, med = 0, low = 0;
        incidents.forEach(i => {
          if (i.score >= 70) crit++;
          else if (i.score >= 40) high++;
          else if (i.score >= 20) med++;
          else low++;
        });
        return { crit, high, med, low, total: incidents.length || 1 };
      }, [state?.incidents]);

      const filteredIncidents = useMemo(() => {
        const incidents = state?.incidents || [];
        return incidents.filter(i => {
          if (severityFilter === "critical" && i.score < 70) return false;
          if (severityFilter === "high" && (i.score < 40 || i.score >= 70)) return false;
          if (severityFilter === "medium" && (i.score < 20 || i.score >= 40)) return false;
          return true;
        });
      }, [state?.incidents, severityFilter]);

      const toggleIsolate = (id) => {
        setIsolatedHosts(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const toggleAcknowledge = (id) => {
        setAcknowledgedIncidents(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const filteredSignals = useMemo(() => {
        const detections = state?.detections || [];
        if (!searchTerm) return detections;
        return detections.filter(d => 
          (d.rule_id || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
          (d.entity || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
          (d.title || d.detail || '').toLowerCase().includes(searchTerm.toLowerCase())
        );
      }, [state?.detections, searchTerm]);

      const filteredEvents = useMemo(() => {
        const events = state?.events || [];
        if (!searchTerm) return events;
        return events.filter(e => 
          (e.category || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
          (e.action || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
          (e.entity || '').toLowerCase().includes(searchTerm.toLowerCase())
        );
      }, [state?.events, searchTerm]);

      const filteredProcesses = useMemo(() => {
        const procs = state?.processes || [];
        if (!searchTerm) return procs;
        return procs.filter(p => 
          (p.name || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
          (p.user || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
          (p.cmdline || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
          (p.pid ? String(p.pid) : '').includes(searchTerm)
        );
      }, [state?.processes, searchTerm]);

      return (
        <div className="flex h-screen w-full overflow-hidden">
          {/* Sidebar */}
          <aside className="w-16 md:w-64 border-r border-slate-200 dark:border-slate-800 flex flex-col justify-between flex-shrink-0 card-panel z-20">
            <div>
              <div className="h-16 flex items-center px-4 border-b border-slate-200 dark:border-slate-800 gap-3">
                <div className="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white flex-shrink-0 shadow-lg shadow-indigo-600/30">
                  <Icon name="shield" className="w-5 h-5" />
                </div>
                <div className="hidden md:flex flex-col">
                  <span className="font-bold text-sm tracking-tight">OSentinel</span>
                  <span className="text-[10px] text-indigo-500 font-mono tracking-wider font-semibold">ENTERPRISE SOC</span>
                </div>
              </div>

              <nav className="p-3 space-y-1.5">
                {[
                  { id: 'overview', label: 'SOC Overview', icon: 'layout-dashboard' },
                  { id: 'detections', label: 'Signal Detections', icon: 'shield-alert' },
                  { id: 'processes', label: 'Process Pool', icon: 'cpu' },
                  { id: 'telemetry', label: 'Raw Telemetry', icon: 'activity' },
                  { id: 'rules', label: 'YARA Signatures', icon: 'file-code' },
                  { id: 'config', label: 'Agent Status', icon: 'server' },
                ].map((item) => (
                  <button
                    key={item.id}
                    onClick={() => setViewMode(item.id)}
                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-medium transition-all ${
                      viewMode === item.id 
                        ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/20 font-semibold' 
                        : 'text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60 hover:text-slate-200'
                    }`}
                  >
                    <Icon name={item.icon} className="w-4 h-4" />
                    <span className="hidden md:inline">{item.label}</span>
                  </button>
                ))}
              </nav>
            </div>

            <div className="p-3 border-t border-slate-200 dark:border-slate-800 space-y-2">
              <button onClick={toggleTheme} className="w-full flex items-center gap-3 px-3 py-2 rounded-xl text-xs text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                <Icon name={theme === 'dark' ? "sun" : "moon"} className="w-4 h-4 text-indigo-500" />
                <span className="hidden md:inline font-medium">{theme === 'dark' ? 'Light Theme' : 'Dark Theme'}</span>
              </button>
              
              <button onClick={logout} className="w-full flex items-center gap-3 px-3 py-2 rounded-xl text-xs text-red-500 hover:bg-red-500/10 transition-colors">
                <Icon name="log-out" className="w-4 h-4" />
                <span className="hidden md:inline font-medium">Logout Session</span>
              </button>
            </div>
          </aside>

          {/* Main Content Area */}
          <div className="flex-1 flex flex-col h-full overflow-hidden">
            
            {/* Header */}
            <header className="h-16 border-b border-slate-200 dark:border-slate-800 card-panel px-6 flex items-center justify-between flex-shrink-0 z-10">
              <div className="flex items-center gap-4">
                <div className="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-lg input-field text-xs font-mono">
                  <Icon name="monitor" className="w-3.5 h-3.5 text-indigo-500" />
                  <span className="font-semibold">{state?.status?.host?.hostname || 'LocalHost'}</span>
                  <span className="text-slate-500">|</span>
                  <span className="text-slate-400">{state?.status?.host?.platform || 'Win 11'}</span>
                </div>

                <div className="flex items-center gap-2 px-3 py-1 rounded-full text-[11px] font-semibold border border-emerald-500/30 bg-emerald-500/10 text-emerald-500">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  <span className="uppercase tracking-wider font-mono text-[10px]">{viewMode} VIEW</span>
                </div>

                {state?.status?.response?.mode === "enforcing" ? (
                  <div className="hidden md:flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold border border-red-500/30 bg-red-500/10 text-red-500">
                    <Icon name="shield-check" className="w-3.5 h-3.5" />
                    <span>PREVENTION ARMED</span>
                  </div>
                ) : (
                  <div className="hidden md:flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold border border-amber-500/30 bg-amber-500/10 text-amber-500">
                    <Icon name="shield-alert" className="w-3.5 h-3.5" />
                    <span>SAFE MODE (DRY RUN)</span>
                  </div>
                )}
              </div>

              {/* Search */}
              <div className="flex items-center gap-4">
                <div className="relative w-48 lg:w-64">
                  <Icon name="search" className="absolute left-3 top-2.5 w-3.5 h-3.5 text-slate-400" />
                  <input
                    type="text"
                    placeholder={`Search in ${viewMode}...`}
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="input-field w-full py-1.5 pl-9 pr-3 rounded-xl text-xs focus:outline-none focus:border-indigo-500 transition-colors"
                  />
                </div>
                <div className="h-6 w-px bg-slate-700/40"></div>
                <div className="w-8 h-8 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-500 font-bold text-xs">
                  SA
                </div>
              </div>
            </header>

            {/* Content Body */}
            <div className="flex-1 overflow-y-auto p-4 md:p-6 space-y-6">

              {/* ================= ENHANCED VIEW 1: SOC OVERVIEW ================= */}
              {viewMode === "overview" && (
                <>
                  {/* Top Dashboard Banner - Severity Distribution */}
                  <div className="card-panel p-4 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-4 border border-slate-200 dark:border-slate-800">
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded-xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400">
                        <Icon name="bar-chart-2" className="w-5 h-5" />
                      </div>
                      <div>
                        <h3 className="text-xs font-bold text-slate-200 uppercase tracking-wider">Threat Severity Distribution</h3>
                        <p className="text-[11px] text-slate-400">Breakdown of actively flagged security alerts</p>
                      </div>
                    </div>

                    <div className="w-full md:w-2/3 flex flex-col gap-1.5">
                      <div className="h-3.5 w-full bg-slate-800/60 rounded-full overflow-hidden flex">
                        <div style={{ width: `${(severityCounts.crit / severityCounts.total) * 100}%` }} className="bg-red-500 h-full transition-all" title="Critical"></div>
                        <div style={{ width: `${(severityCounts.high / severityCounts.total) * 100}%` }} className="bg-amber-500 h-full transition-all" title="High"></div>
                        <div style={{ width: `${(severityCounts.med / severityCounts.total) * 100}%` }} className="bg-blue-500 h-full transition-all" title="Medium"></div>
                        <div style={{ width: `${(severityCounts.low / severityCounts.total) * 100}%` }} className="bg-emerald-500 h-full transition-all" title="Low"></div>
                      </div>
                      <div className="flex justify-between items-center text-[10px] font-mono text-slate-400 px-1">
                        <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-red-500"></span> Critical ({severityCounts.crit})</span>
                        <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-amber-500"></span> High ({severityCounts.high})</span>

      const handleLogin = (t) => {
        setToken(t);
        setTokenState(t);
      };
      
      const handleLogout = () => {
        setToken(null);
        setTokenState(null);
      };

      useEffect(() => {
        if (!token) return;
        
        let wsProto = window.location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(`${wsProto}//${window.location.host}/ws`);
        
        ws.onopen = () => ws.send(JSON.stringify({ type: "auth", token }));
        ws.onmessage = (e) => {
          try {
            const msg = JSON.parse(e.data);
            if (msg.type === "snapshot") {
              setState(prev => ({ ...prev, ...msg.data }));
            } else if (msg.type === "metrics") {
              setState(prev => ({
                ...prev,
                metrics: msg.data,
                history: [...(prev?.history || []), msg.data].slice(-120)
              }));
            } else if (msg.type === "events") {
              setState(prev => ({ ...prev, events: [...msg.data, ...(prev?.events || [])].slice(0, 120) }));
            } else if (msg.type === "detections") {
              setState(prev => ({ ...prev, detections: [...msg.data, ...(prev?.detections || [])].slice(0, 80) }));
            } else if (msg.type === "incident") {
              setState(prev => {
                const incs = [...(prev?.incidents || [])];
                const idx = incs.findIndex(i => i.id === msg.data.id);
                if(idx >= 0) incs[idx] = msg.data;
                else incs.unshift(msg.data);
                return { ...prev, incidents: incs };
              });
            } else if (msg.type === "action") {
              setState(prev => ({ ...prev, actions: [msg.data, ...(prev?.actions || [])].slice(0, 30) }));
            }
          } catch(err) {}
        };
        ws.onclose = () => console.log("WebSocket connection closed");
        wsRef.current = ws;

        const poll = setInterval(async () => {
           try { await apiFetch("/api/health"); } catch(e) {}
        }, 5000);

        return () => {
          ws.close();
          clearInterval(poll);
        };
      }, [token]);

      if (!token) return <LoginScreen onLogin={handleLogin} theme={theme} toggleTheme={toggleTheme} />;
      return <Dashboard state={state} logout={handleLogout} theme={theme} toggleTheme={toggleTheme} />;
    };

    setTimeout(() => {
      if(window.lucide) window.lucide.createIcons();
    }, 100);

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
