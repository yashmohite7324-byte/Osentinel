<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<<title>Sign in — OSentinel</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body {
    background-color: #050505;
    background-image: 
      radial-gradient(circle at 15% 50%, rgba(16, 185, 129, 0.08) 0%, transparent 50%),
      radial-gradient(circle at 85% 30%, rgba(14, 165, 233, 0.08) 0%, transparent 50%);
    font-family: 'Inter', sans-serif;
    color: #e2e8f0;
  }
  .glass-panel {
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  }
  .input-field:focus {
    box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
  }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md">
  <!-- Branding -->
  <div class="flex items-center justify-center gap-3 mb-8">
    <div class="relative flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/20 shadow-[0_0_15px_rgba(16,185,129,0.2)]">
      <i data-lucide="shield-check" class="text-emerald-400 w-6 h-6"></i>
    </div>
    <div class="flex flex-col">
      <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
        OSentinel
      </h1>
      <span class="text-xs text-slate-400 font-medium tracking-wide uppercase">AI Threat Prevention</span>
    </div>
  </div>

  <!-- Login Card -->
  <form id="f" autocomplete="on" novalidate class="glass-panel rounded-2xl p-8 relative overflow-hidden">
    <!-- Top accent line -->
    <div class="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-emerald-500 to-transparent opacity-50"></div>

    <div class="mb-6">
      <h2 class="text-lg font-semibold text-white mb-1">Secure Sign In</h2>
      <p class="text-sm text-slate-400">Authenticate to access the EDR console.</p>
    </div>

    <div class="msg text-sm p-3 rounded-lg mb-4 hidden border" id="msg" role="alert" aria-live="polite"></div>

    <div class="space-y-5">
      <div>
        <label for="u" class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wider">Operator ID</label>
        <div class="relative">
          <i data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
          <input id="u" name="username" autocomplete="username" required
                 class="input-field w-full bg-slate-900/50 border border-slate-700/50 rounded-lg py-2.5 pl-10 pr-4 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500/50 transition-all"
                 placeholder="Enter username">
        </div>
      </div>

      <div>
        <label for="p" class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wider">Access Token</label>
        <div class="relative">
          <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
          <input id="p" name="password" type="password" autocomplete="current-password" required
                 class="input-field w-full bg-slate-900/50 border border-slate-700/50 rounded-lg py-2.5 pl-10 pr-4 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500/50 transition-all"
                 placeholder="••••••••">
        </div>
      </div>

      <button id="go" type="submit" 
              class="w-full mt-2 bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white font-medium text-sm py-2.5 rounded-lg shadow-lg shadow-emerald-500/20 transition-all active:scale-[0.98] disabled:opacity-50 flex justify-center items-center gap-2">
        <span>Initialize Session</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </div>

    <div class="mt-8 pt-6 border-t border-slate-700/50 flex justify-between items-center text-[11px] font-mono text-slate-500">
      <div class="flex items-center gap-2">
        <div id="hdot" class="w-2 h-2 rounded-full bg-slate-600"></div>
        <span id="hstat">CHECKING AGENT</span>
      </div>
      <span id="hname" class="text-slate-400">127.0.0.1</span>
    </div>
  </form>

  <p class="text-center text-xs text-slate-500 mt-6 max-w-sm mx-auto leading-relaxed">
    <i data-lucide="info" class="w-3 h-3 inline-block mr-1 -mt-0.5"></i>
    Running locally. End-to-end encrypted connection. Unauthorized access is strictly prohibited.
  </p>
</div>

<script>
lucide.createIcons();
const $ = id => document.getElementById(id);
const msg = (text, kind) => {
  const m = $("msg");
  m.textContent = text;
  m.className = `msg p-3 rounded-lg mb-4 text-sm border block ${
    kind === "error" 
      ? "bg-red-500/10 border-red-500/20 text-red-400" 
      : "bg-amber-500/10 border-amber-500/20 text-amber-400"
  }`;
};

(async () => {
  try {
    const r = await fetch("/api/health");
    const d = await r.json();
    const healthy = d.ok === true;
    $("hstat").textContent = healthy ? "AGENT ONLINE" : "AGENT DEGRADED";
    $("hname").textContent = location.host;
    if (healthy) {
      $("hdot").className = "w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)] animate-pulse";
    }
  } catch {
    $("hstat").textContent = "AGENT UNREACHABLE";
    msg("Agent offline. Start it with `python run.py`, then reload.", "info");
  }
})();

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const u = $("u").value.trim(), p = $("p").value;
  if (!u || !p){
    msg("Enter both Operator ID and Access Token.", "error");
    (!u ? $("u") : $("p")).focus();
    return;
  }
  $("go").disabled = true;
  $("go").querySelector("span").textContent = "Authenticating...";
  try {
    const r = await fetch("/api/login", {
      method: "POST",
      headers: {"content-type": "application/json"},
      body: JSON.stringify({username: u, password: p})
    });
    if (r.ok){
      $("go").querySelector("span").textContent = "Authenticated";
      location.href = "/";
      return;
    }
    const d = await r.json().catch(() => ({}));
    msg(d.detail || "Authentication failed. Invalid credentials.", "error");
    $("p").value = "";
    $("p").focus();
  } catch {
    msg("Connection refused. Verify the backend agent is running.", "error");
  } finally {
    $("go").disabled = false;
    if ($("go").querySelector("span").textContent === "Authenticating...") {
      $("go").querySelector("span").textContent = "Initialize Session";
    }
  }
});

$("u").focus();
</script>
</body>
</html>
